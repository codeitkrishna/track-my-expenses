# Generates TME.xcodeproj. After adding or removing files, run: xcodegen
name: TME
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TMECore:
    path: Packages/TMECore
targets:
  TME:
    type: application
    platform: iOS
    sources:
      - path: TME
      - path: Shared
    dependencies:
      - package: TMECore
      - target: TMEWidgets
    info:
      path: TME/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: tmetracker
            CFBundleURLSchemes: [tmetracker]
    settings:
      base:
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tme
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TME
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  TMEWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TMEWidgets
      - path: Shared
    info:
      path: TMEWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tme.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TME
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
  TMETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TMETests
    dependencies:
      - target: TME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tme.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TME.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TME
        BUNDLE_LOADER: $(TEST_HOST)
  TMEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TMEUITests
    dependencies:
      - target: TME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tme.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TME
schemes:
  TME:
    build:
      targets:
        TME: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TMETests
        - TMEUITests
